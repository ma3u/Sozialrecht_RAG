<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sozialrecht RAG - Coverage Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-label {
            color: #999;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f8f9fa;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status {
            font-size: 1.5em;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
        }
        
        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Sozialrecht RAG Dashboard</h1>
            <p class="subtitle">Coverage Monitoring für 14 Use Cases</p>
            <button class="refresh-btn" onclick="loadAllData()">🔄 Aktualisieren</button>
        </header>
        
        <div class="stats-grid" id="healthStats">
            <div class="stat-card">
                <div class="stat-label">Documents</div>
                <div class="stat-value" id="statDocuments">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Norms</div>
                <div class="stat-value" id="statNorms">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Chunks</div>
                <div class="stat-value" id="statChunks">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Embeddings</div>
                <div class="stat-value" id="statEmbeddings">-</div>
            </div>
        </div>
        
        <div class="section">
            <h2>🎯 Use Case Coverage (7 Use Cases)</h2>
            <div id="useCasesTable" class="loading">
                <div class="spinner"></div>
                Lädt Use Cases...
            </div>
        </div>
        
        <div class="section">
            <h2>📚 SGB Statistiken</h2>
            <div id="sgbStatsTable" class="loading">
                <div class="spinner"></div>
                Lädt SGB Statistiken...
            </div>
        </div>
    </div>
    
    <script>
        async function loadHealth() {
            try {
                const response = await fetch('/api/health');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    document.getElementById('statDocuments').textContent = data.documents.toLocaleString();
                    document.getElementById('statNorms').textContent = data.norms.toLocaleString();
                    document.getElementById('statChunks').textContent = data.chunks.toLocaleString();
                    document.getElementById('statEmbeddings').textContent = data.embeddings.toLocaleString();
                }
            } catch (error) {
                console.error('Health check failed:', error);
            }
        }
        
        async function loadUseCases() {
            try {
                const response = await fetch('/api/use_cases');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Use Case</th>
                                    <th>Name</th>
                                    <th>SGB</th>
                                    <th>Coverage</th>
                                    <th>Chunks</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.forEach(uc => {
                        const coveragePercent = (uc.normen / uc.expected) * 100;
                        const badgeClass = uc.status === '✅' ? 'badge-success' : 
                                          uc.status === '⚠️' ? 'badge-warning' : 'badge-danger';
                        
                        html += `
                            <tr>
                                <td><strong>${uc.uc}</strong></td>
                                <td>${uc.name}</td>
                                <td>SGB ${uc.sgb}</td>
                                <td>
                                    <div>${uc.coverage}</div>
                                    <div class="progress-bar">
                                        <div class="progress-fill" style="width: ${coveragePercent}%"></div>
                                    </div>
                                </td>
                                <td>${uc.chunks}</td>
                                <td>
                                    <span class="status">${uc.status}</span>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                            </tbody>
                        </table>
                    `;
                    
                    document.getElementById('useCasesTable').innerHTML = html;
                }
            } catch (error) {
                console.error('Use cases failed:', error);
                document.getElementById('useCasesTable').innerHTML = '<p>❌ Fehler beim Laden der Use Cases</p>';
            }
        }
        
        async function loadSGBStats() {
            try {
                const response = await fetch('/api/sgb_stats');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>SGB</th>
                                    <th>Titel</th>
                                    <th>Normen</th>
                                    <th>Chunks</th>
                                    <th>Coverage</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.forEach(sgb => {
                        html += `
                            <tr>
                                <td><strong>SGB ${sgb.sgb}</strong></td>
                                <td>${sgb.titel || 'N/A'}</td>
                                <td>${sgb.normen}</td>
                                <td>${sgb.chunks}</td>
                                <td>
                                    <span class="badge badge-success">${sgb.coverage_percent}%</span>
                                    <div class="progress-bar">
                                        <div class="progress-fill" style="width: ${sgb.coverage_percent}%"></div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                            </tbody>
                        </table>
                    `;
                    
                    document.getElementById('sgbStatsTable').innerHTML = html;
                }
            } catch (error) {
                console.error('SGB stats failed:', error);
                document.getElementById('sgbStatsTable').innerHTML = '<p>❌ Fehler beim Laden der SGB Statistiken</p>';
            }
        }
        
        function loadAllData() {
            loadHealth();
            loadUseCases();
            loadSGBStats();
        }
        
        // Initial load
        loadAllData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadAllData, 30000);
    </script>
</body>
</html>
